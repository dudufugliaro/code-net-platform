<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Cadastre-se</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex items-center justify-center p-6">

    <div class="w-full max-w-md bg-slate-800 p-8 rounded-xl shadow-2xl border border-white/5">
        
        <div class="mb-6 text-center">
            <h1 class="text-3xl font-bold text-white tracking-tight">Criar Conta</h1>
            <p class="text-sm text-slate-400 mt-2">Junte-se à nossa comunidade.</p>
        </div>

        <form method="POST" class="space-y-4">
            {% csrf_token %}
            
            <div class="django-form-fields space-y-3">
                {{ form.as_p }}
            </div>

            <div class="pt-4">
                <button type="submit" 
                        class="w-full bg-indigo-500 hover:bg-indigo-600 text-white font-bold py-3 px-4 rounded-lg transition-colors focus:ring-2 focus:ring-indigo-400">
                    Cadastrar
                </button>
            </div>
        </form>
    </div>

</body>
</html>
