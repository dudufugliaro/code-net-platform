<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil do Usuário</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex items-center justify-center p-6">

    <div class="w-full max-w-xl bg-slate-800 p-8 rounded-xl shadow-2xl border border-white/5">
        
        <div class="mb-6">
            <h1 class="text-2xl font-bold text-white tracking-tight">Informações do Perfil</h1>
            <p class="text-sm text-slate-400 mt-1">Atualize os dados da sua conta de desenvolvedor.</p>
        </div>

        <form method="POST" class="space-y-5">
            {% csrf_token %}
            
            <div class="django-form-fields space-y-4">
                {{ form.as_p }}
            </div>

            <div class="pt-2">
                <button type="submit" 
                        class="w-full bg-indigo-500 hover:bg-indigo-600 text-white font-medium py-2.5 px-4 rounded-lg transition-colors duration-200 focus:outline-none focus:ring-2 focus:ring-indigo-400 focus:ring-offset-2 focus:ring-offset-slate-800">
                    Salvar Alterações
                </button>
            </div>
        </form>

    </div>

</body>
</html>
