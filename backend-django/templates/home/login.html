<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Entrar</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Estilizando os inputs gerados automaticamente pelo Django */
        .django-form-fields input {
            width: 100%;
            border-radius: 0.5rem;
            background-color: #1e293b; /* bg-slate-800 */
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 0.5rem 0.75rem;
            color: #f1f5f9;
            margin-top: 0.25rem;
            margin-bottom: 1rem;
        }
        .django-form-fields input:focus {
            outline: none;
            box-shadow: 0 0 0 2px #818cf8; /* focus:ring-indigo-400 */
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex items-center justify-center p-6">

    <div class="w-full max-w-md bg-slate-800 p-8 rounded-xl shadow-2xl border border-white/5">
        
        <div class="mb-6 text-center">
            <h1 class="text-3xl font-bold text-white tracking-tight">Bem-vindo de volta</h1>
            <p class="text-sm text-slate-400 mt-2">Faça login para acessar seu perfil.</p>
        </div>

        <form method="POST" class="space-y-4">
            {% csrf_token %}
            
            <div class="django-form-fields">
                {{ form.as_p }}
            </div>

            <div class="pt-2">
                <button type="submit" 
                        class="w-full bg-indigo-500 hover:bg-indigo-600 text-white font-bold py-3 px-4 rounded-lg transition-colors">
                    Entrar
                </button>
            </div>
        </form>

        <div class="mt-6 text-center text-sm text-slate-400">
            Ainda não tem uma conta? 
            <a href="{% url 'cadastrar' %}" class="text-indigo-400 hover:text-indigo-300 font-medium">Cadastre-se aqui</a>
        </div>
        
    </div>

</body>
</html>
